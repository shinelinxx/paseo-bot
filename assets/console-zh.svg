<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="960" height="700" rx="16" fill="#0d1017" stroke="#23293a" stroke-width="1.5"/>

  <!-- Top Hero Card -->
  <rect x="24" y="22" width="912" height="176" rx="14" fill="#151924" stroke="#262d40" stroke-width="1"/>

  <!-- Bot Avatar -->
  <rect x="44" y="40" width="38" height="38" rx="11" fill="url(#accentGrad)"/>
  <circle cx="57" cy="57" r="2.5" fill="#ffffff"/>
  <circle cx="69" cy="57" r="2.5" fill="#ffffff"/>
  <rect x="55" y="64" width="16" height="2.5" rx="1.2" fill="#ffffff"/>

  <!-- Title & Active Pill -->
  <text x="94" y="56" fill="#f1f5f9" font-size="18" font-weight="700">Paseo Bot</text>
  <rect x="190" y="42" width="52" height="20" rx="10" fill="#1d2433"/>
  <text x="216" y="56" fill="#22c55e" font-size="11" font-weight="700" text-anchor="middle">运行中</text>

  <!-- L1 Ambient Status Line -->
  <text x="94" y="76" fill="#94a3b8" font-size="12">3 条规则运行中 · 已静默跳过 18 次无变化检查</text>

  <!-- Top Right Actions -->
  <rect x="620" y="40" width="88" height="30" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="664" y="59" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">打开对话</text>

  <rect x="716" y="40" width="104" height="30" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="768" y="59" fill="#e2e8f0" font-size="12" text-anchor="middle">暂停自动运行</text>

  <rect x="828" y="40" width="88" height="30" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="872" y="59" fill="#94a3b8" font-size="12" text-anchor="middle">运行状态 ▾</text>

  <!-- Task / Rule Input Bar -->
  <rect x="44" y="94" width="778" height="40" rx="10" fill="#1d2332" stroke="#2d354b"/>
  <text x="58" y="119" fill="#64748b" font-size="13">输入要处理的任务，或直接说明自动规则（例如：有新草稿自动归档、低于 $50 的账单不用提醒）…</text>

  <rect x="832" y="94" width="84" height="40" rx="10" fill="url(#accentGrad)"/>
  <text x="874" y="119" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">发送</text>

  <!-- Quick Action Chips -->
  <rect x="44" y="146" width="108" height="26" rx="13" fill="#1d2332" stroke="#2d354b"/>
  <text x="98" y="163" fill="#cbd5e1" font-size="11" text-anchor="middle">✦ 生成今日汇总</text>

  <rect x="160" y="146" width="116" height="26" rx="13" fill="#1d2332" stroke="#2d354b"/>
  <text x="218" y="163" fill="#cbd5e1" font-size="11" text-anchor="middle">整理收件箱草稿</text>

  <rect x="284" y="146" width="116" height="26" rx="13" fill="#1d2332" stroke="#2d354b"/>
  <text x="342" y="163" fill="#cbd5e1" font-size="11" text-anchor="middle">查看进行中任务</text>

  <!-- 4 Navigation Tabs -->
  <rect x="24" y="212" width="92" height="34" rx="17" fill="#6366f1"/>
  <text x="70" y="233" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">动态 (2)</text>

  <rect x="126" y="212" width="106" height="34" rx="17" fill="#151924" stroke="#262d40"/>
  <text x="179" y="233" fill="#cbd5e1" font-size="13" text-anchor="middle">待确认 (1)</text>

  <rect x="242" y="212" width="118" height="34" rx="17" fill="#151924" stroke="#262d40"/>
  <text x="301" y="233" fill="#cbd5e1" font-size="13" text-anchor="middle">自动规则 (3)</text>

  <rect x="370" y="212" width="142" height="34" rx="17" fill="#151924" stroke="#262d40"/>
  <text x="441" y="233" fill="#cbd5e1" font-size="13" text-anchor="middle">子任务与记忆 (1)</text>

  <!-- Urgent Confirmation Banner (Inline on Updates Tab) -->
  <rect x="24" y="260" width="912" height="44" rx="11" fill="#181c28" stroke="#2c344a"/>
  <rect x="24" y="260" width="4" height="44" rx="2" fill="#f59e0b"/>
  <text x="44" y="287" fill="#f8fafc" font-size="13" font-weight="600">⚠ 有 1 项敏感操作等待你确认（发送月度对账单邮件）</text>
  <rect x="862" y="270" width="58" height="24" rx="12" fill="#f59e0b"/>
  <text x="891" y="286" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">去处理</text>

  <!-- Suggested Rule Card -->
  <rect x="24" y="316" width="912" height="78" rx="12" fill="#151924" stroke="#6366f1" stroke-width="1"/>
  <text x="42" y="338" fill="#818cf8" font-size="11" font-weight="700">✦ 常用操作建议</text>
  <text x="894" y="338" fill="#64748b" font-size="11">忽略</text>
  <text x="42" y="359" fill="#f1f5f9" font-size="14" font-weight="700">为「OrderHub」添加每日自动检查</text>
  <text x="42" y="378" fill="#94a3b8" font-size="12">近期你在 OrderHub 多次手动运行了日志核对任务，可设为每日 09:00 自动跟进。</text>
  <rect x="814" y="352" width="104" height="28" rx="8" fill="#6366f1"/>
  <text x="866" y="370" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">✓ 设为自动规则</text>

  <!-- Section Header: Today -->
  <text x="26" y="418" fill="#94a3b8" font-size="12" font-weight="700">今天</text>
  <text x="816" y="418" fill="#94a3b8" font-size="11">显示无变化记录  ·  全部已读</text>

  <!-- Actionable Update Card -->
  <rect x="24" y="428" width="912" height="248" rx="12" fill="#151924" stroke="#6366f1" stroke-width="1"/>
  <circle cx="43" cy="451" r="4" fill="#6366f1"/>
  <text x="56" y="456" fill="#f8fafc" font-size="14" font-weight="700">早间邮件与待办汇总：2 项需处理</text>

  <rect x="716" y="440" width="124" height="20" rx="10" fill="#1e2434"/>
  <text x="778" y="454" fill="#94a3b8" font-size="11" text-anchor="middle">每日 08:30 早间汇总</text>
  <text x="854" y="454" fill="#64748b" font-size="11">11-26 08:30</text>

  <!-- Summary Lines -->
  <text x="42" y="482" fill="#e2e8f0" font-size="13">1. 云服务账单出账 $128.40（较上月 +18%），建议核对新增实例用量。</text>
  <text x="42" y="502" fill="#e2e8f0" font-size="13">2. 知识库 00-Inbox 有 3 篇新草稿待归档；其余 14 封营销邮件已自动过滤。</text>

  <!-- Expandable Details Link -->
  <text x="42" y="524" fill="#94a3b8" font-size="11">▾ 展开详情（账单明细与过滤列表）</text>

  <!-- Micro-Actions & Filter Row -->
  <rect x="42" y="538" width="126" height="28" rx="8" fill="#151924" stroke="#6366f1"/>
  <text x="105" y="556" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">⚡ 归档 3 篇草稿</text>

  <rect x="176" y="538" width="84" height="28" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="218" y="556" fill="#e2e8f0" font-size="12" text-anchor="middle">继续追问</text>

  <rect x="268" y="538" width="112" height="28" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="324" y="556" fill="#94a3b8" font-size="12" text-anchor="middle">⏰ 2 小时后再提醒</text>

  <rect x="388" y="538" width="84" height="28" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="430" y="556" fill="#e2e8f0" font-size="12" text-anchor="middle">查看对话 ↗</text>

  <rect x="480" y="538" width="64" height="28" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="512" y="556" fill="#94a3b8" font-size="11" text-anchor="middle">👍 有用</text>

  <rect x="552" y="538" width="108" height="28" rx="8" fill="#1e2434" stroke="#f59e0b"/>
  <text x="606" y="556" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="middle">🔇 减少此类提醒</text>

  <rect x="668" y="540" width="66" height="24" rx="7" fill="#1e2434"/>
  <text x="701" y="556" fill="#94a3b8" font-size="11" text-anchor="middle">标为已读</text>

  <!-- Inline Filter Drawer (Opened when clicking 减少此类提醒) -->
  <rect x="42" y="576" width="876" height="84" rx="9" fill="#1c2231" stroke="#2d354b"/>
  <rect x="54" y="586" width="116" height="24" rx="7" fill="#151924" stroke="#2d354b"/>
  <text x="112" y="602" fill="#e2e8f0" font-size="11" text-anchor="middle">轻微变化不用提醒</text>

  <rect x="178" y="586" width="106" height="24" rx="7" fill="#151924" stroke="#2d354b"/>
  <text x="231" y="602" fill="#e2e8f0" font-size="11" text-anchor="middle">合并到每日汇总</text>

  <rect x="292" y="586" width="96" height="24" rx="7" fill="#151924" stroke="#2d354b"/>
  <text x="340" y="602" fill="#f59e0b" font-size="11" text-anchor="middle">停用这条规则</text>

  <rect x="54" y="618" width="780" height="32" rx="7" fill="#151924" stroke="#2d354b"/>
  <text x="66" y="638" fill="#94a3b8" font-size="12">低于 $50 的常规订阅账单不用提醒，直接静默跳过</text>

  <rect x="842" y="618" width="64" height="32" rx="7" fill="#6366f1"/>
  <text x="874" y="638" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">确定</text>
</svg>

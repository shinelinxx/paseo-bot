  <text x="50" y="310" fill="#94a3b8" font-size="11">Runs daily at 09:00 and stages outbound email drafts for confirmation first.</text>

  <text x="36" y="344" fill="#94a3b8" font-size="12">▾ More parameters (File change / Command or URL check / Webhook / Schedule)</text>


  <text x="145" y="166" fill="#cbd5e1" font-size="11" text-anchor="middle">Every day at 08:30 summarize inbox</text>

  <rect x="262" y="150" width="218" height="24" rx="12" fill="#1c2231" stroke="#2d354b"/>
  <text x="371" y="166" fill="#cbd5e1" font-size="11" text-anchor="middle">Watch ~/Downloads for new files</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="accentGradEn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="960" height="700" rx="16" fill="#0d1017" stroke="#23293a" stroke-width="1.5"/>

  <!-- Hero Card -->
  <rect x="24" y="22" width="912" height="176" rx="14" fill="#151924" stroke="#262d40" stroke-width="1"/>

  <rect x="44" y="40" width="38" height="38" rx="11" fill="url(#accentGradEn)"/>
  <circle cx="57" cy="57" r="2.5" fill="#ffffff"/>
  <circle cx="69" cy="57" r="2.5" fill="#ffffff"/>
  <rect x="55" y="64" width="16" height="2.5" rx="1.2" fill="#ffffff"/>

  <text x="94" y="56" fill="#f1f5f9" font-size="18" font-weight="700">Paseo Bot</text>
  <rect x="190" y="42" width="64" height="20" rx="10" fill="#1d2433"/>
  <text x="222" y="56" fill="#22c55e" font-size="11" font-weight="700" text-anchor="middle">Running</text>

  <text x="94" y="76" fill="#94a3b8" font-size="12">3 rule(s) active · Skipped 18 unchanged check(s)</text>

  <rect x="606" y="40" width="92" height="30" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="652" y="59" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Open Chat</text>

  <rect x="706" y="40" width="118" height="30" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="765" y="59" fill="#e2e8f0" font-size="12" text-anchor="middle">Pause Auto-Run</text>

  <rect x="832" y="40" width="84" height="30" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="874" y="59" fill="#94a3b8" font-size="12" text-anchor="middle">Status ▾</text>

  <rect x="44" y="94" width="778" height="40" rx="10" fill="#1d2332" stroke="#2d354b"/>
  <text x="58" y="119" fill="#64748b" font-size="13">Assign a task or describe an automatic rule (e.g. file new drafts in 00-Inbox, ignore bills under $50)...</text>

  <rect x="832" y="94" width="84" height="40" rx="10" fill="url(#accentGradEn)"/>
  <text x="874" y="119" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Send</text>

  <rect x="44" y="146" width="118" height="26" rx="13" fill="#1d2332" stroke="#2d354b"/>
  <text x="103" y="163" fill="#cbd5e1" font-size="11" text-anchor="middle">✦ Daily Summary</text>

  <rect x="170" y="146" width="144" height="26" rx="13" fill="#1d2332" stroke="#2d354b"/>
  <text x="242" y="163" fill="#cbd5e1" font-size="11" text-anchor="middle">Organize Inbox Drafts</text>

  <rect x="322" y="146" width="140" height="26" rx="13" fill="#1d2332" stroke="#2d354b"/>
  <text x="392" y="163" fill="#cbd5e1" font-size="11" text-anchor="middle">Check Running Tasks</text>

  <!-- Tabs -->
  <rect x="24" y="212" width="108" height="34" rx="17" fill="#6366f1"/>
  <text x="78" y="233" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Updates (2)</text>

  <rect x="142" y="212" width="142" height="34" rx="17" fill="#151924" stroke="#262d40"/>
  <text x="213" y="233" fill="#cbd5e1" font-size="13" text-anchor="middle">Confirmations (1)</text>

  <rect x="294" y="212" width="124" height="34" rx="17" fill="#151924" stroke="#262d40"/>
  <text x="356" y="233" fill="#cbd5e1" font-size="13" text-anchor="middle">Auto Rules (3)</text>

  <rect x="428" y="212" width="168" height="34" rx="17" fill="#151924" stroke="#262d40"/>
  <text x="512" y="233" fill="#cbd5e1" font-size="13" text-anchor="middle">Subtasks &amp; Memory (1)</text>

  <!-- Urgent Confirmation Banner -->
  <rect x="24" y="260" width="912" height="44" rx="11" fill="#181c28" stroke="#2c344a"/>
  <rect x="24" y="260" width="4" height="44" rx="2" fill="#f59e0b"/>
  <text x="44" y="287" fill="#f8fafc" font-size="13" font-weight="600">⚠ 1 sensitive action(s) waiting for confirmation (Send November invoice summary)</text>
  <rect x="854" y="270" width="66" height="24" rx="12" fill="#f59e0b"/>
  <text x="887" y="286" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Review</text>

  <!-- Suggested Rule Card -->
  <rect x="24" y="316" width="912" height="78" rx="12" fill="#151924" stroke="#6366f1"/>
  <text x="42" y="338" fill="#818cf8" font-size="11" font-weight="700">✦ Suggested Rule</text>
  <text x="880" y="338" fill="#64748b" font-size="11">Dismiss</text>
  <text x="42" y="359" fill="#f1f5f9" font-size="14" font-weight="700">Add a daily check for 'OrderHub'</text>
  <text x="42" y="378" fill="#94a3b8" font-size="12">You ran manual tasks in OrderHub multiple times recently — turn it into a daily 09:00 rule.</text>
  <rect x="814" y="352" width="104" height="28" rx="8" fill="#6366f1"/>
  <text x="866" y="370" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">✓ Add as Rule</text>

  <!-- Today Header -->
  <text x="26" y="418" fill="#94a3b8" font-size="12" font-weight="700">Today</text>
  <text x="752" y="418" fill="#94a3b8" font-size="11">Show unchanged checks  ·  Mark all read</text>

  <!-- Actionable Update Card -->
  <rect x="24" y="428" width="912" height="248" rx="12" fill="#151924" stroke="#6366f1"/>
  <circle cx="43" cy="451" r="4" fill="#6366f1"/>
  <text x="56" y="456" fill="#f8fafc" font-size="14" font-weight="700">Morning Inbox &amp; Todo Summary: 2 items need attention</text>

  <rect x="706" y="440" width="134" height="20" rx="10" fill="#1e2434"/>
  <text x="773" y="454" fill="#94a3b8" font-size="11" text-anchor="middle">Daily 08:30 Summary</text>
  <text x="854" y="454" fill="#64748b" font-size="11">11-26 08:30</text>

  <text x="42" y="482" fill="#e2e8f0" font-size="13">1. Cloud invoice posted at $128.40 (+18% MoM) — review newly added worker nodes.</text>
  <text x="42" y="502" fill="#e2e8f0" font-size="13">2. 3 new drafts waiting in 00-Inbox; 14 promotional newsletters skipped silently.</text>

  <text x="42" y="524" fill="#94a3b8" font-size="11">▾ Show details (billing breakdown &amp; skipped items)</text>

  <rect x="42" y="538" width="128" height="28" rx="8" fill="#151924" stroke="#6366f1"/>
  <text x="106" y="556" fill="#f1f5f9" font-size="12" font-weight="600" text-anchor="middle">⚡ File 3 drafts</text>

  <rect x="178" y="538" width="88" height="28" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="222" y="556" fill="#e2e8f0" font-size="12" text-anchor="middle">Follow up</text>

  <rect x="274" y="538" width="104" height="28" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="326" y="556" fill="#94a3b8" font-size="12" text-anchor="middle">⏰ Remind in 2h</text>

  <rect x="386" y="538" width="90" height="28" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="431" y="556" fill="#e2e8f0" font-size="12" text-anchor="middle">View Chat ↗</text>

  <rect x="484" y="538" width="70" height="28" rx="8" fill="#1e2434" stroke="#2d354b"/>
  <text x="519" y="556" fill="#94a3b8" font-size="11" text-anchor="middle">👍 Useful</text>

  <rect x="562" y="538" width="114" height="28" rx="8" fill="#1e2434" stroke="#f59e0b"/>
  <text x="619" y="556" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="middle">🔇 Fewer like this</text>

  <rect x="684" y="540" width="76" height="24" rx="7" fill="#1e2434"/>
  <text x="722" y="556" fill="#94a3b8" font-size="11" text-anchor="middle">Mark read</text>

  <!-- Inline Filter Drawer -->
  <rect x="42" y="576" width="876" height="84" rx="9" fill="#1c2231" stroke="#2d354b"/>
  <rect x="54" y="586" width="126" height="24" rx="7" fill="#151924" stroke="#2d354b"/>
  <text x="117" y="602" fill="#e2e8f0" font-size="11" text-anchor="middle">Skip minor changes</text>

  <rect x="188" y="586" width="168" height="24" rx="7" fill="#151924" stroke="#2d354b"/>
  <text x="272" y="602" fill="#e2e8f0" font-size="11" text-anchor="middle">Include in daily summary only</text>

  <rect x="364" y="586" width="108" height="24" rx="7" fill="#151924" stroke="#2d354b"/>
  <text x="418" y="602" fill="#f59e0b" font-size="11" text-anchor="middle">Disable this rule</text>

  <rect x="54" y="618" width="780" height="32" rx="7" fill="#151924" stroke="#2d354b"/>
  <text x="66" y="638" fill="#94a3b8" font-size="12">Ignore recurring subscription charges under $50</text>

  <rect x="842" y="618" width="64" height="32" rx="7" fill="#6366f1"/>
  <text x="874" y="638" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Save</text>
</svg>
